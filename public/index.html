<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<title>ATEM Audio Presets</title>
		<link rel="icon" href="logo-meters.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<a class="skip" href="#panel-A">Skip to the source column</a>
		<header>
			<div class="brand">
				<img class="brandmark" src="logo-meters.svg" alt="" width="18" height="22" />
				<div class="brandtext">
					<h1>ATEM Audio Presets</h1>
					<a class="brandby" href="https://studioupgrade.com" target="_blank" rel="noreferrer">by <strong>STUDIO UPGRADE</strong></a>
				</div>
			</div>
			<div class="head-actions">
				<button id="undo" class="side-action">Undo</button>
				<button id="apply" class="primary big">Copy →</button>
				<button id="blend" class="blend big" title="Mix the source with each destination's own settings, by how much you choose">Blend</button>
				<button id="redo" class="side-action" disabled>Redo</button>
			</div>
			<div class="head-right">
				<button id="swap" title="Swap the two switchers" aria-label="Swap the two switchers">⇄</button>
				<button id="browse-open" class="big libcta">Community presets</button>
			</div>
		</header>

		<div id="blendbar" class="blendbar" hidden></div>
		<div id="confirmbar" class="blendbar confirmbar" hidden></div>

		<main>
			<section class="side" id="panel-A" aria-label="Source">
				<div class="list-stack">
					<h2 class="section-title" id="title-A">Source</h2>
					<div class="col list-col">
					<div class="col-head">
						<div class="col-top">
							<div class="kinds" role="group" aria-label="What the source column holds">
								<button class="kind on" data-kind="atem" aria-pressed="true">Switcher</button>
								<button class="kind" data-kind="library" aria-pressed="false">Presets</button>
							</div>
						</div>
						<div class="conn">
							<label class="sr-only" for="ip-A">Source switcher address</label>
							<span class="ipwrap">
								<input class="ip" id="ip-A" type="text" placeholder="192.168.8.20" autocomplete="off" spellcheck="false" inputmode="decimal" />
								<button class="ipmenu" aria-label="Pick a known switcher address" aria-expanded="false" title="Pick a known switcher address">▾</button>
							</span>
							<button class="connect">Go</button>
						</div>
						<div class="device" role="status"></div>
					</div>
					<div class="channel-list" role="listbox" aria-labelledby="title-A" tabindex="0"></div>
					</div>
				</div>
				<div class="col card-col">
					<div class="selcount" role="status"></div>
					<div class="detail"></div>
				</div>
			</section>

			<div class="flowdiv" aria-hidden="true"></div>

			<section class="side" id="panel-B" aria-label="Destination">
				<div class="list-stack">
					<h2 class="section-title" id="title-B">Destination</h2>
					<div class="col list-col">
					<div class="col-head">
						<div class="col-top">
							<div class="kinds" role="group" aria-label="What the destination column holds">
								<button class="kind on" data-kind="atem" aria-pressed="true">Switcher</button>
								<button class="kind" data-kind="library" aria-pressed="false">Presets</button>
							</div>
						</div>
						<div class="conn">
							<label class="sr-only" for="ip-B">Destination switcher address</label>
							<span class="ipwrap">
								<input class="ip" id="ip-B" type="text" placeholder="192.168.43.20" autocomplete="off" spellcheck="false" inputmode="decimal" />
								<button class="ipmenu" aria-label="Pick a known switcher address" aria-expanded="false" title="Pick a known switcher address">▾</button>
							</span>
							<button class="connect">Go</button>
						</div>
						<div class="device" role="status"></div>
					</div>
					<div class="channel-list" role="listbox" aria-labelledby="title-B" aria-multiselectable="true" tabindex="0"></div>
					</div>
				</div>
				<div class="col card-col">
					<div class="selcount" role="status"></div>
					<div class="detail"></div>
				</div>
			</section>
		</main>

		<datalist id="recent-ips"></datalist>

		<!-- Notifications: a stack in the top right, floating over everything, each one dismissable. -->
		<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
		<div id="helppanel" class="helppanel" hidden></div>
		<div id="logbox" class="logbox" hidden>
			<div class="logtop"><b>What changed</b><button id="logclose" aria-label="Close the details">×</button></div>
			<div id="log"></div>
		</div>

		<footer class="statusbar">
			<div class="status" id="status" role="status" aria-live="polite"></div>
			<div class="madeby">
				<a class="sulink" href="https://studioupgrade.com" target="_blank" rel="noreferrer"><img src="su-logo.png" alt="" height="26" /> <strong>Studio Upgrade</strong></a>
				<a class="footbtn loop" href="https://loop.studioupgrade.com" target="_blank" rel="noreferrer">Join the community</a>
				<a class="footbtn coffee" id="coffee" href="#" target="_blank" rel="noreferrer" title="Free and open source — a tip keeps it moving">Say thanks</a>
				<button id="help-open" class="footbtn" aria-expanded="false">Help</button>
			</div>
		</footer>


		<div id="browse" class="browse" hidden></div>

		<script src="strip.js"></script>
		<script src="tips.js"></script>
		<!-- Off unless the page is opened outside the local app server, or with ?demo=1. -->
		<script src="demo.js"></script>
		<script src="app.js"></script>
		<script src="browse.js"></script>
	</body>
</html>
